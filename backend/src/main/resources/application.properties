spring.application.name=arremate

# Porta da API
server.port=8080

# Banco H2 salvo em arquivo (pasta backend/data). Os dados continuam depois de reiniciar.
spring.datasource.url=jdbc:h2:file:./data/arremate
spring.datasource.username=sa
spring.datasource.password=

# Quem cria as tabelas é o Flyway (db/migration), não o Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Console do banco: http://localhost:8080/h2-console
spring.h2.console.enabled=true

# Endereço do front liberado no CORS (separe vários com vírgula)
arremate.cors.origens=http://localhost:5173

# Código que sempre funciona no login, para testes (igual ao protótipo).
# Deixe vazio para aceitar só o código sorteado (que aparece no console).
arremate.auth.codigo-fixo=1234
