spring.application.name=arremate

# Porta da API
server.port=8080

# Banco H2 salvo em arquivo (pasta backend/data). Os dados continuam depois de reiniciar.
spring.datasource.url=jdbc:h2:file:./data/arremate
spring.datasource.username=sa
spring.datasource.password=

# Quem cria as tabelas é o Flyway (db/migration), não o Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
# db/migration = tabelas. db/exemplo = usuários de exemplo (Maria e José). Em produção, deixe só db/migration.
spring.flyway.locations=classpath:db/migration,classpath:db/exemplo

# Console do banco: http://localhost:8080/h2-console
spring.h2.console.enabled=true

# Endereço do front liberado no CORS (separe vários com vírgula)
arremate.cors.origens=http://localhost:5173

# Código que sempre funciona no login, para testes (igual ao protótipo).
# Deixe vazio para aceitar só o código sorteado (que aparece no console).
arremate.auth.codigo-fixo=1234

# IA da tela Ajuda (Gemini Developer API). A chave fica só aqui no servidor, lida da
# variável de ambiente GEMINI_API_KEY, e nunca vai para o navegador nem para o Git.
# Sem chave, POST /ajuda/perguntar responde 503 ia_nao_configurada e o front usa a
# versão simulada da IA.
arremate.ia.chave=${GEMINI_API_KEY:}
arremate.ia.modelo=${GEMINI_MODELO:gemini-3.5-flash-lite}
arremate.ia.url=https://generativelanguage.googleapis.com/v1beta
arremate.ia.tempo-limite-segundos=15
# Pedidos à IA por pessoa, a cada hora (protege a cota da chave)
arremate.ia.pedidos-por-hora=30
